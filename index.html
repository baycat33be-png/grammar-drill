<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文法瞬間リコール ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Shippori+Mincho:wght@500;600;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A4A;
    --navy-soft:#3C4A63;
    --gold:#A9812E;
    --gold-light:#C9A24B;
    --ivory:#FAFAF8;
    --answer-bg:#FBF6EC;
    --white:#FFFFFF;
    --line:#E4E1D8;
    --slate:#5B6472;
    --green:#4C7A5E;
    --red:#A0473C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter','Noto Sans JP',sans-serif;
    background:var(--navy);
    color:var(--navy);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .en{font-family:'Cormorant Garamond',serif;}
  .jp-serif{font-family:'Shippori Mincho',serif;}

  #app{
    max-width:920px;
    margin:0 auto;
    min-height:100vh;
    background:var(--ivory);
    box-shadow:0 0 60px rgba(0,0,0,.25);
    display:flex;
    flex-direction:column;
  }

  header{
    background:var(--navy);
    color:var(--white);
    padding:28px 32px 24px;
    position:relative;
  }
  header .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    color:var(--gold-light);
    font-weight:600;
  }
  header h1{
    font-family:'Shippori Mincho',serif;
    font-size:26px;
    margin:6px 0 2px;
    font-weight:800;
    letter-spacing:.02em;
  }
  header .sub{
    font-size:13px;
    color:#AEB8CC;
  }
  .stage-badge{
    position:absolute;
    top:28px;right:32px;
    font-size:11px;
    color:var(--gold-light);
    border:1px solid #3A4A6B;
    border-radius:20px;
    padding:5px 12px;
    letter-spacing:.06em;
  }

  main{flex:1;padding:28px 32px 40px;}

  .setup-intro{
    color:var(--slate);
    font-size:14.5px;
    line-height:1.8;
    margin-bottom:24px;
    max-width:60ch;
  }
  .setup-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .pill-btn{
    border:1px solid var(--line);
    background:var(--white);
    padding:9px 16px;
    border-radius:8px;
    font-size:13.5px;
    color:var(--navy-soft);
    cursor:pointer;
    font-family:inherit;
    transition:.15s;
  }
  .pill-btn:hover{border-color:var(--gold);}
  .pill-btn.active{
    background:var(--navy);
    border-color:var(--navy);
    color:var(--white);
  }
  .section-label{
    font-size:12px;
    letter-spacing:.08em;
    color:var(--gold);
    font-weight:700;
    margin:24px 0 10px;
  }
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:8px;
    margin-bottom:8px;
  }
  .cat-check{
    display:flex;
    align-items:center;
    gap:9px;
    border:1px solid var(--line);
    background:var(--white);
    border-radius:8px;
    padding:10px 12px;
    cursor:pointer;
    font-size:13px;
    color:var(--navy-soft);
  }
  .cat-check.on{
    border-color:var(--gold);
    background:#FBF6E9;
  }
  .cat-check input{accent-color:var(--gold);}
  .cat-check .cnt{
    margin-left:auto;
    font-size:11px;
    color:#9AA0AC;
  }
  .cat-actions{
    display:flex;gap:14px;margin:6px 0 0;
  }
  .link-btn{
    background:none;border:none;color:var(--gold);
    font-size:12.5px;cursor:pointer;padding:0;
    font-family:inherit;text-decoration:underline;
  }
  .start-bar{
    margin-top:32px;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
  }
  .start-btn{
    background:var(--navy);
    color:var(--white);
    border:none;
    border-radius:10px;
    padding:15px 34px;
    font-size:15px;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
    font-family:'Shippori Mincho',serif;
    box-shadow:0 4px 14px rgba(27,42,74,.25);
  }
  .start-btn:disabled{
    background:#B9BEC9;
    box-shadow:none;
    cursor:not-allowed;
  }
  .list-btn{
    background:var(--white);
    color:var(--navy);
    border:1.5px solid var(--navy);
    border-radius:10px;
    padding:14px 26px;
    font-size:14px;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
    font-family:'Shippori Mincho',serif;
  }
  .list-btn:disabled{
    border-color:#C9CCD3;
    color:#B9BEC9;
    cursor:not-allowed;
  }
  .start-count{
    font-size:13px;
    color:var(--slate);
  }
  .reset-progress{
    margin-left:auto;
    font-size:12px;
    color:#A0473C;
    background:none;border:none;cursor:pointer;
    text-decoration:underline;
    font-family:inherit;
  }

  .drill-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
  }
  .progress-wrap{flex:1;margin-right:20px;}
  .progress-track{
    height:5px;background:var(--line);border-radius:3px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:var(--gold);border-radius:3px;
    transition:width .25s;
  }
  .progress-text{
    font-size:12px;color:var(--slate);margin-top:6px;
  }
  .exit-btn{
    font-size:12.5px;color:var(--slate);background:none;border:1px solid var(--line);
    border-radius:20px;padding:6px 14px;cursor:pointer;font-family:inherit;
  }

  .card{
    background:var(--white);
    border-radius:16px;
    border:1px solid var(--line);
    padding:0;
    overflow:hidden;
    box-shadow:0 2px 18px rgba(27,42,74,.06);
  }
  .card-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    background:#FCFBF8;
  }
  .cat-tag{
    font-size:11.5px;
    color:var(--gold);
    font-weight:700;
    letter-spacing:.03em;
  }
  .dir-tag{
    font-size:11px;
    color:var(--navy-soft);
    font-weight:600;
    border:1px solid var(--line);
    border-radius:20px;
    padding:4px 10px;
    background:var(--white);
  }
  .card-body{
    min-height:200px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 32px;
    text-align:center;
  }
  .prompt-text{
    font-family:'Cormorant Garamond',serif;
    font-size:30px;
    font-weight:600;
    color:var(--navy);
    line-height:1.5;
  }
  .prompt-text.jp{
    font-family:'Shippori Mincho',serif;
    font-size:24px;
  }
  .prompt-example{
    font-family:'Cormorant Garamond',serif;
    font-size:26px;
    font-weight:600;
    color:var(--navy);
    line-height:1.55;
  }
  .prompt-example .hl{
    color:var(--gold);
    border-bottom:2px solid var(--gold-light);
  }
  .prompt-sub{
    margin-top:14px;
    font-size:12.5px;
    color:#9AA0AC;
    font-family:'Inter',sans-serif;
  }
  .answer-block{width:100%;}
  .answer-label{
    font-size:11px;
    letter-spacing:.1em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:10px;
  }
  .answer-text{
    font-family:'Shippori Mincho',serif;
    font-size:20px;
    color:var(--navy);
    line-height:1.7;
    margin-bottom:18px;
  }
  .answer-en{
    font-family:'Cormorant Garamond',serif;
    font-size:30px;
    color:var(--navy);
    font-weight:700;
    margin-bottom:6px;
  }
  .answer-full{
    font-size:12.5px;
    color:var(--slate);
    font-family:'Inter',sans-serif;
    margin-bottom:16px;
  }
  .answer-example{
    font-family:'Cormorant Garamond',serif;
    font-size:18px;
    color:var(--navy-soft);
    font-style:italic;
    margin-top:4px;
  }
  .sibling-block{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--line);
    text-align:left;
    max-width:440px;
    margin-left:auto;
    margin-right:auto;
  }
  .sibling-label{
    font-size:11px;
    letter-spacing:.06em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:8px;
    font-family:'Inter',sans-serif;
  }
  .sibling-row{
    font-size:13.5px;
    color:var(--navy-soft);
    line-height:1.7;
    padding:3px 0 3px 16px;
    position:relative;
  }
  .sibling-row::before{
    content:"・";
    position:absolute;
    left:0;
    color:var(--gold-light);
  }
  .card-actions{
    padding:18px 24px 24px;
    display:flex;
    gap:12px;
    justify-content:center;
    border-top:1px solid var(--line);
  }
  .reveal-btn{
    background:var(--gold);
    color:var(--white);
    border:none;
    border-radius:10px;
    padding:13px 30px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .verdict-btn{
    flex:1;
    max-width:220px;
    border-radius:10px;
    padding:13px 18px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    border:1.5px solid var(--line);
    background:var(--white);
  }
  .verdict-btn.again{color:var(--red);border-color:#E9D3CE;}
  .verdict-btn.again:hover{background:#FBF0EE;}
  .verdict-btn.know{color:var(--green);border-color:#CFE0D5;}
  .verdict-btn.know:hover{background:#F1F7F3;}

  .done-wrap{
    text-align:center;
    padding:60px 20px;
  }
  .done-wrap .en{
    font-size:40px;color:var(--navy);margin-bottom:8px;
  }
  .done-wrap p{color:var(--slate);font-size:14px;margin-bottom:26px;}

  .list-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
  }
  .list-count{
    font-size:13px;
    color:var(--slate);
  }
  .list-cat{
    font-family:'Shippori Mincho',serif;
    font-size:17px;
    font-weight:700;
    color:var(--navy);
    margin:28px 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .list-cat:first-of-type{margin-top:0;}
  .list-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding:8px 0;
    border-bottom:1px solid #F0EDE6;
    font-size:14px;
    line-height:1.6;
  }
  .list-en{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    color:var(--navy);
    font-size:16px;
    min-width:220px;
    flex-shrink:0;
  }
  .list-arrow{
    color:var(--gold-light);
    flex-shrink:0;
  }
  .list-jp{
    color:var(--navy-soft);
  }

  footer{
    text-align:center;
    padding:18px;
    font-size:11px;
    color:#9AA0AC;
  }

  @media (max-width:600px){
    header{padding:22px 18px 20px;}
    main{padding:20px 18px 30px;}
    .prompt-text{font-size:24px;}
    .prompt-example{font-size:21px;}
    .list-row{flex-direction:column;gap:2px;}
    .list-en{min-width:0;}
    .stage-badge{position:static;display:inline-block;margin-top:10px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stage-badge" id="stageBadge">PHASE 2</div>
    <div class="eyebrow">GRAMMAR RECALL DRILL</div>
    <h1>文法瞬間リコール ドリル</h1>
    <div class="sub">377パターン ・ カテゴリー別に絞り込み ・ 日→英 / 英→日</div>
  </header>

  <main id="main"></main>
  <footer>クリックで答えを表示 → わかった/もう一度 で振り分け</footer>
</div>

<script>
// Raw rows: [category, pattern(en), meaning(jp), example(en, optional)]

// Normalize to 4 fields, then append stable id
const CARDS = RAW_CARDS.map((c, i) => {
  const row = c.length === 3 ? [c[0], c[1], c[2], ''] : c;
  row.push('c' + i);
  return row; // [cat, en, jp, ex, id]
});

function mainOf(cat){ return cat.replace(/[（(].*$/,''); }

const grouped = {};
CARDS.forEach(c=>{
  const m = mainOf(c[0]);
  if(!grouped[m]) grouped[m] = [];
  grouped[m].push(c[0]);
});
Object.keys(grouped).forEach(k=> grouped[k] = [...new Set(grouped[k])]);

// Strip a trailing circled-number nuance marker (①-⑩) plus an optional
// immediately-following parenthetical, to get the "production" form —
// e.g. "might ②" -> "might", "can ⑤(疑問)" -> "can".
// Only matches when the circled number is the LAST token, so patterns that
// embed circled numbers mid-string (e.g. inside descriptive parentheses)
// are left untouched.
function cleanEN(en){
  return en.replace(/\s*[①②③④⑤⑥⑦⑧⑨⑩](\([^)]*\))?\s*$/, '').trim();
}

// Group cards that share the same base (clean) English form, within the
// same category, so the answer view can show the word's full meaning range
// (important for recognizing it later while reading/listening) rather than
// just the single nuance that happened to be quizzed.
const siblingsByKey = {};
CARDS.forEach(c=>{
  const [cat, en, jp] = c;
  const base = cleanEN(en);
  const key = cat + '||' + base;
  if(!siblingsByKey[key]) siblingsByKey[key] = [];
  siblingsByKey[key].push({ en, jp });
});
function siblingsFor(cat, base){
  const list = siblingsByKey[cat + '||' + base] || [];
  return list.length > 1 ? list : null;
}

// Consolidated groups for the 英語→日本語 direction: one card per unique
// (category, base word) — the prompt is just the English word, and the
// answer lists every meaning it can carry, all at once. This matches how
// the word is actually encountered while reading/listening (the bare word
// shows up first, and the reader has to recall its full meaning range).
const EN2JP_GROUPS = Object.keys(siblingsByKey).map((key, i)=>{
  const [cat, base] = key.split('||');
  const list = siblingsByKey[key];
  return { cat, base, jpList: list.map(s=>s.jp), id: 'w' + i };
});
// attach an example sentence if any sibling card in CARDS has one
const exampleByKey = {};
CARDS.forEach(c=>{
  const [cat, en, jp, ex] = c;
  const base = cleanEN(en);
  const key = cat + '||' + base;
  if(ex && !exampleByKey[key]) exampleByKey[key] = ex;
});
EN2JP_GROUPS.forEach(g=>{ g.example = exampleByKey[g.cat + '||' + g.base] || ''; });

let selectedCats = new Set(CARDS.map(c=>c[0])); // default: all
let direction = 'random'; // 'jp2en' | 'en2jp' | 'random'
let known = new Set();
let session = null;

const STORAGE_KEY = 'phase2-known-cards';

async function loadKnown(){
  try{
    const r = await window.storage.get(STORAGE_KEY, false);
    if(r && r.value){ known = new Set(JSON.parse(r.value)); }
  }catch(e){ /* no saved progress yet */ }
  render();
}
async function saveKnown(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify([...known]), false); }
  catch(e){ console.error('save failed', e); }
}

function renderSetup(){
  const activeCount = CARDS.filter(c=>selectedCats.has(c[0])).length;
  const knownInSel = CARDS.filter(c=>selectedCats.has(c[0]) && known.has(c[4])).length;

  let catGroupsHtml = '';
  Object.keys(grouped).forEach(main=>{
    const subs = grouped[main];
    catGroupsHtml += `<div class="section-label">${main}</div><div class="cat-grid">`;
    subs.forEach(sub=>{
      const count = CARDS.filter(c=>c[0]===sub).length;
      const on = selectedCats.has(sub);
      catGroupsHtml += `
        <label class="cat-check ${on?'on':''}" data-cat="${escapeAttr(sub)}">
          <input type="checkbox" ${on?'checked':''} />
          <span>${sub}</span>
          <span class="cnt">${count}</span>
        </label>`;
    });
    catGroupsHtml += `</div>`;
  });

  document.getElementById('stageBadge').textContent = 'PHASE 2 ・ セットアップ';
  document.getElementById('main').innerHTML = `
    <p class="setup-intro">カテゴリーを選んで、出題方向を決めてスタート。日本語→英語は産出練習、英語→日本語は例文つきで文脈から意味を判断する。答えは番号なしの素の形でOK。</p>

    <div class="section-label">出題方向</div>
    <div class="setup-row" id="dirRow">
      <button class="pill-btn ${direction==='random'?'active':''}" data-dir="random">ランダム(日→英・英→日)</button>
      <button class="pill-btn ${direction==='jp2en'?'active':''}" data-dir="jp2en">日本語 → 英語</button>
      <button class="pill-btn ${direction==='en2jp'?'active':''}" data-dir="en2jp">英語 → 日本語</button>
    </div>

    ${catGroupsHtml}

    <div class="cat-actions">
      <button class="link-btn" id="selAll">すべて選択</button>
      <button class="link-btn" id="selNone">選択解除</button>
      <button class="link-btn" id="selUnknown">「わかった」以外だけ</button>
    </div>

    <div class="start-bar">
      <button class="start-btn" id="startBtn" ${activeCount===0?'disabled':''}>ドリルを始める</button>
      <button class="list-btn" id="listBtn" ${activeCount===0?'disabled':''}>一覧で見る</button>
      <span class="start-count">${activeCount}問(うち「わかった」済み ${knownInSel})</span>
      <button class="reset-progress" id="resetBtn">進捗をリセット</button>
    </div>
  `;

  document.querySelectorAll('.cat-check').forEach(el=>{
    el.addEventListener('click', e=>{
      e.preventDefault();
      const cat = el.getAttribute('data-cat');
      if(selectedCats.has(cat)) selectedCats.delete(cat); else selectedCats.add(cat);
      renderSetup();
    });
  });
  document.querySelectorAll('#dirRow .pill-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      direction = el.getAttribute('data-dir');
      renderSetup();
    });
  });
  document.getElementById('selAll').onclick = ()=>{ selectedCats = new Set(CARDS.map(c=>c[0])); renderSetup(); };
  document.getElementById('selNone').onclick = ()=>{ selectedCats = new Set(); renderSetup(); };
  document.getElementById('selUnknown').onclick = ()=>{
    selectedCats = new Set(CARDS.filter(c=>!known.has(c[4])).map(c=>c[0]));
    renderSetup();
  };
  document.getElementById('resetBtn').onclick = async ()=>{
    if(confirm('「わかった」の記録をすべて消します。よろしいですか?')){
      known = new Set();
      await saveKnown();
      renderSetup();
    }
  };
  const startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.onclick = startSession;
  const listBtn = document.getElementById('listBtn');
  if(listBtn) listBtn.onclick = renderList;
}

function escapeAttr(s){ return s.replace(/"/g,'&quot;'); }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Normalize a raw JP→EN card (from CARDS) into a common record shape.
function toJp2enRecord(card){
  const [cat, en, jp, ex, id] = card;
  const base = cleanEN(en);
  return { cat, dir:'jp2en', en, jp, ex, base, id };
}
// Normalize a consolidated EN→JP group into the same common record shape.
function toEn2jpRecord(group){
  return { cat: group.cat, dir:'en2jp', base: group.base, ex: group.example, jpList: group.jpList, id: group.id };
}

function startSession(){
  let pool;
  if(direction === 'jp2en'){
    pool = CARDS.filter(c=>selectedCats.has(c[0])).map(toJp2enRecord);
  } else if(direction === 'en2jp'){
    pool = EN2JP_GROUPS.filter(g=>selectedCats.has(g.cat)).map(toEn2jpRecord);
  } else {
    const a = CARDS.filter(c=>selectedCats.has(c[0])).map(toJp2enRecord);
    const b = EN2JP_GROUPS.filter(g=>selectedCats.has(g.cat)).map(toEn2jpRecord);
    pool = a.concat(b);
  }
  pool = shuffle(pool);
  session = {
    queue: pool,
    idx: 0,
    revealed: false,
    stats: {know:0, again:0},
    total: pool.length,
  };
  document.getElementById('stageBadge').textContent = 'PHASE 2 ・ ドリル中';
  renderDrill();
}

// Wrap the clean base form where it appears in the example sentence, for a
// light highlight. Falls back to showing the plain sentence if no match.
function highlightExample(example, base){
  if(!example) return '';
  const escaped = escapeHtml(example);
  const words = base.split(/\s+/).filter(Boolean);
  const firstWord = words[0];
  if(!firstWord) return escaped;
  const re = new RegExp('\\b(' + firstWord.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&') + ')\\b', 'i');
  return escaped.replace(re, '<span class="hl">$1</span>');
}

function renderDrill(){
  if(!session || session.idx >= session.queue.length){
    renderDone();
    return;
  }
  const card = session.queue[session.idx];
  const { cat, dir, base, ex, id } = card;
  const pct = Math.round((session.idx/session.total)*100);
  const dirLabel = dir==='jp2en' ? '日本語 → 英語' : '英語 → 日本語';
  const askLabel = dir==='jp2en' ? '英語でどう言う?' : 'どんな意味?';

  let bodyHtml;
  if(!session.revealed){
    if(dir === 'jp2en'){
      bodyHtml = `<div class="prompt-text jp">${escapeHtml(card.jp)}</div>`;
    } else {
      if(ex){
        bodyHtml = `<div class="prompt-example">${highlightExample(ex, base)}</div>`;
      } else {
        bodyHtml = `<div class="prompt-text en">${escapeHtml(base)}</div>`;
      }
    }
  } else if(dir === 'jp2en'){
    // Answer = clean production form, with the full labeled pattern as reference,
    // plus (when this word has more than one nuance) the word's full meaning
    // range — useful for recognizing it later while reading/listening.
    const sibs = siblingsFor(cat, base);
    let sibsHtml = '';
    if(sibs){
      sibsHtml = `
        <div class="sibling-block">
          <div class="sibling-label">${escapeHtml(base)} の意味一覧</div>
          ${sibs.map(s => `<div class="sibling-row">${escapeHtml(s.jp)}</div>`).join('')}
        </div>
      `;
    }
    bodyHtml = `
      <div class="answer-block">
        <div class="answer-label">ANSWER</div>
        <div class="answer-en">${escapeHtml(base)}</div>
        ${base !== card.en ? `<div class="answer-full">正式には: ${escapeHtml(card.en)}</div>` : ``}
        ${ex ? `<div class="answer-example">${escapeHtml(ex)}</div>` : ``}
        ${sibsHtml}
      </div>
    `;
  } else {
    // en2jp: one consolidated card per word — list every meaning at once.
    const list = card.jpList || [card.jp];
    bodyHtml = `
      <div class="answer-block">
        <div class="answer-label">ANSWER</div>
        ${list.map(j => `<div class="answer-text" style="margin-bottom:6px;">${escapeHtml(j)}</div>`).join('')}
      </div>
    `;
  }

  document.getElementById('main').innerHTML = `
    <div class="drill-top">
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-text">${session.idx+1} / ${session.total} ・ わかった ${session.stats.know} ・ もう一度 ${session.stats.again}</div>
      </div>
      <button class="exit-btn" id="exitBtn">終了</button>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="cat-tag">${cat}</span>
        <span class="dir-tag">${dirLabel}</span>
      </div>
      <div class="card-body">
        ${session.revealed ? bodyHtml : `<div>${bodyHtml}<div class="prompt-sub" style="color:var(--gold);font-style:italic;">${askLabel}</div></div>`}
      </div>
      <div class="card-actions">
        ${session.revealed
          ? `<button class="verdict-btn again" id="againBtn">もう一度</button>
             <button class="verdict-btn know" id="knowBtn">わかった</button>`
          : `<button class="reveal-btn" id="revealBtn">答えを見る</button>`
        }
      </div>
    </div>
  `;

  document.getElementById('exitBtn').onclick = ()=>{ session=null; renderSetup(); };
  const revealBtn = document.getElementById('revealBtn');
  if(revealBtn) revealBtn.onclick = ()=>{ session.revealed = true; renderDrill(); };
  const knowBtn = document.getElementById('knowBtn');
  if(knowBtn) knowBtn.onclick = async ()=>{
    known.add(id);
    await saveKnown();
    session.stats.know++;
    session.idx++;
    session.revealed = false;
    renderDrill();
  };
  const againBtn = document.getElementById('againBtn');
  if(againBtn) againBtn.onclick = ()=>{
    const c = session.queue[session.idx];
    const insertAt = Math.min(session.queue.length, session.idx + 4 + Math.floor(Math.random()*3));
    session.queue.splice(session.idx,1);
    session.queue.splice(insertAt,0,c);
    session.stats.again++;
    session.revealed = false;
    renderDrill();
  };
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderDone(){
  document.getElementById('stageBadge').textContent = 'PHASE 2 ・ 完了';
  document.getElementById('main').innerHTML = `
    <div class="done-wrap">
      <div class="en">Well done.</div>
      <p>「わかった」${session.stats.know}問 ・ 「もう一度」${session.stats.again}問(このセッション内で復習済み)</p>
      <button class="start-btn" id="backBtn">セットアップに戻る</button>
    </div>
  `;
  document.getElementById('backBtn').onclick = ()=>{ session=null; renderSetup(); };
}

function renderList(){
  document.getElementById('stageBadge').textContent = 'PHASE 2 ・ 一覧';

  const cards = CARDS.filter(c=>selectedCats.has(c[0]));
  const bySub = {};
  cards.forEach(c=>{
    if(!bySub[c[0]]) bySub[c[0]] = [];
    bySub[c[0]].push(c);
  });

  let listHtml = '';
  Object.keys(bySub).forEach(sub=>{
    listHtml += `<div class="list-cat">${sub}</div>`;
    bySub[sub].forEach(c=>{
      const [, en, jp] = c;
      listHtml += `
        <div class="list-row">
          <span class="list-en">${escapeHtml(en)}</span>
          <span class="list-arrow">→</span>
          <span class="list-jp">${escapeHtml(jp)}</span>
        </div>
      `;
    });
  });

  document.getElementById('main').innerHTML = `
    <div class="list-top">
      <span class="list-count">${cards.length}項目</span>
      <button class="exit-btn" id="listBackBtn">セットアップに戻る</button>
    </div>
    ${listHtml}
  `;
  document.getElementById('listBackBtn').onclick = ()=>{ renderSetup(); };
}

function render(){
  if(session) renderDrill(); else renderSetup();
}

loadKnown();
</script>
</body>
</html>
